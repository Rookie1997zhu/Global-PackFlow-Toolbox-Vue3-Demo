name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-toolbox-vue3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-toolbox-vue3/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - name: Build with prerender
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: |
          export SITE_ORIGIN="${SITE_ORIGIN:-https://example.com}"
          export VITE_BASE="${VITE_BASE:-/}"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: global-toolbox-vue3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
